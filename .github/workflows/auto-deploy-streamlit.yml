name: Auto Deploy Streamlit

on:
  push:
    branches:
      - main
      - cursor/gemini-news-source-f1f3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamlit-auto-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall app.py feedback_engine.py

  deploy:
    name: Confirm deployment
    runs-on: ubuntu-latest
    needs: validate
    env:
      APP_URL_PROD: ${{ vars.STREAMLIT_APP_URL_PROD }}
      APP_URL_STAGING: ${{ vars.STREAMLIT_APP_URL_STAGING }}
    steps:
      - name: Resolve app URL by branch
        id: resolve
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "app_url=${APP_URL_PROD}" >> "$GITHUB_OUTPUT"
          else
            echo "app_url=${APP_URL_STAGING}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deployment trigger note
        run: |
          echo "Push received for branch: ${GITHUB_REF_NAME}"
          echo "Streamlit Community Cloud redeploys automatically on GitHub push."

      - name: Health check deployed app
        env:
          APP_URL: ${{ steps.resolve.outputs.app_url }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "No app URL configured; skipping smoke check."
            echo "Set STREAMLIT_APP_URL_PROD and STREAMLIT_APP_URL_STAGING in repo variables."
            exit 0
          fi

          for attempt in 1 2 3 4; do
            echo "Health check attempt ${attempt}: $APP_URL"
            if curl --fail --silent --show-error --location --max-time 60 "$APP_URL" > /tmp/app.html; then
              if [ -s /tmp/app.html ]; then
                echo "Deployment is reachable."
                exit 0
              fi
            fi
            sleep 20
          done

          echo "App health check failed after retries."
          exit 1
